<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Wiz Finding Report — a Claude Code skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3864"/>
      <stop offset="1" stop-color="#2E5496"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle right-side motif: the five report tabs -->
  <g opacity="0.10" fill="#FFFFFF">
    <rect x="860" y="66"  width="280" height="26" rx="6"/>
    <rect x="860" y="104" width="280" height="26" rx="6"/>
    <rect x="860" y="142" width="280" height="26" rx="6"/>
    <rect x="860" y="180" width="280" height="26" rx="6"/>
    <rect x="860" y="218" width="190" height="26" rx="6"/>
  </g>

  <!-- title -->
  <text x="64" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">Wiz Finding Report</text>

  <!-- tagline -->
  <text x="66" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#D9E1F2">A Claude Code skill — turn Wiz findings into remediation-ready work</text>

  <!-- severity accent stripe: Critical / High / Medium / Resolved -->
  <g>
    <rect x="66"  y="230" width="72" height="10" rx="5" fill="#C00000"/>
    <rect x="144" y="230" width="72" height="10" rx="5" fill="#ED7D31"/>
    <rect x="222" y="230" width="72" height="10" rx="5" fill="#FFC000"/>
    <rect x="300" y="230" width="72" height="10" rx="5" fill="#70AD47"/>
  </g>
</svg>
